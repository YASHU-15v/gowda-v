<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeshwanth Gowda V | AI Marketing Specialist</title>
    <style>
        /* Luxury Color Palette & Variables */
        :root {
            --bg-blue: #0A1128; /* Deep Navy Blue */
            --gold: #D4AF37;    /* Metallic Gold */
            --red: #A31621;     /* Rich Crimson Red */
            --text-light: #F4F4F6;
            --text-muted: #B0B3C6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background-color: var(--bg-blue);
            color: var(--text-light);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Navigation */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: rgba(10, 17, 40, 0.95);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        .nav-logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .nav-logo {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid var(--gold);
        }

        .nav-brand {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--gold);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .book-btn {
            background-color: var(--red);
            color: var(--text-light);
            padding: 10px 25px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            border: 1px solid var(--red);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .book-btn:hover {
            background-color: transparent;
            color: var(--red);
            border-color: var(--red);
        }

        /* Hero / About Section */
        .hero {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 100px 5% 50px;
            gap: 50px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .hero-text {
            flex: 1;
        }

        .hero-text h1 {
            font-size: 3.5rem;
            color: var(--gold);
            margin-bottom: 10px;
            line-height: 1.2;
        }

        .hero-text h2 {
            font-size: 1.8rem;
            color: var(--text-light);
            margin-bottom: 20px;
            font-weight: 300;
        }

        .hero-text p {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .expertise-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 30px;
        }

        .tag {
            background: rgba(212, 175, 55, 0.1);
            color: var(--gold);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        /* 3D Profile Image Styling */
        .hero-image {
            flex: 1;
            display: flex;
            justify-content: center;
            perspective: 1000px;
        }

        .profile-img {
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            object-fit: cover;
            border: 3px solid var(--gold);
            /* 3D Animation effect */
            transform: rotateY(-10deg) rotateX(5deg);
            box-shadow: 20px 20px 40px rgba(0,0,0,0.8),
                       -10px -10px 30px rgba(212, 175, 55, 0.15);
            transition: transform 0.5s ease, box-shadow 0.5s ease;
        }

        .profile-img:hover {
            transform: rotateY(0deg) rotateX(0deg);
            box-shadow: 0px 10px 30px rgba(212, 175, 55, 0.3);
        }

        /* Contact & Links Section */
        .contact-links {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
        }

        .contact-link {
            display: inline-flex;
            align-items: center;
            color: var(--text-light);
            text-decoration: none;
            font-size: 1.1rem;
            transition: color 0.3s ease;
        }

        .contact-link:hover {
            color: var(--gold);
        }

        .contact-icon {
            margin-right: 15px;
            color: var(--gold);
            font-weight: bold;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 50px 20px;
            background: #060b1a;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            margin-top: 50px;
        }

        .footer-logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            margin-bottom: 15px;
            object-fit: cover;
        }

        .footer-brand {
            font-size: 1.5rem;
            color: var(--gold);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
        }

        /* WhatsApp Floating Button */
        .whatsapp-float {
            position: fixed;
            width: 60px;
            height: 60px;
            bottom: 40px;
            right: 40px;
            background-color: #25d366;
            color: #FFF;
            border-radius: 50px;
            text-align: center;
            font-size: 30px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: transform 0.3s ease;
        }

        .whatsapp-float:hover {
            transform: scale(1.1);
        }
