<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeshwanth Gowda V | AI Marketing Specialist</title>
    <!-- Elegant Fonts for Luxury Branding -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* CSS Variables for Luxury Theme (Blue, Gold, Red) */
        :root {
            --primary-blue: #0A1128; /* Deep Navy Blue */
            --accent-gold: #D4AF37;  /* Metallic Gold */
            --accent-red: #8B0000;   /* Deep Crimson Red */
            --text-light: #F8F9FA;
            --text-muted: #B0B3B8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--primary-blue);
            color: var(--text-light);
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3 {
            font-family: 'Cinzel', serif;
            color: var(--accent-gold);
        }

        /* Layout Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Hero / About Section */
        .hero-section {
            display: flex;
            flex-direction: column;
            gap: 40px;
            margin-top: 50px;
        }

        @media (min-width: 768px) {
            .hero-section {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
            }
        }

        .about-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            border-left: 4px solid var(--accent-gold);
            padding-left: 20px;
        }

        .profile-photo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent-gold);
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        .about-left h1 {
            font-size: 2.5rem;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .about-left h2 {
            font-size: 1.2rem;
            color: var(--text-light);
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .about-left p {
            font-size: 1rem;
            color: var(--text-muted);
            max-width: 500px;
            margin-bottom: 30px;
        }

        .visual-right {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .photo-3d {
            width: 100%;
            max-width: 400px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(212, 175, 55, 0.2);
            transition: transform 0.3s ease;
        }

        .photo-3d:hover {
            transform: translateY(-10px);
        }

        /* Buttons & Interactions */
        .actions-section {
            margin: 50px 0;
            text-align: center;
        }

        .btn-book {
            display: inline-block;
            background-color: var(--accent-red);
            color: var(--text-light);
            padding: 15px 40px;
            font-size: 1.1rem;
            font-family: 'Cinzel', serif;
            text-decoration: none;
            border-radius: 5px;
            border: 1px solid var(--accent-red);
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(139, 0, 0, 0.4);
        }

        .btn-book:hover {
            background-color: transparent;
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
        }

        /* Contact & Socials */
        .contact-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 60px;
        }

        @media (min-width: 768px) {
            .contact-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .contact-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.2);
            padding: 30px;
            text-align: center;
            border-radius: 8px;
            text-decoration: none;
            color: var(--text-light);
            transition: all 0.3s ease;
        }

        .contact-card:hover {
            background: rgba(212, 175, 55, 0.1);
            border-color: var(--accent-gold);
            transform: translateY(-5px);
        }

        .contact-card i {
            font-size: 2rem;
            color: var(--accent-gold);
            margin-bottom: 15px;
        }

        .contact-card h3 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            color: var(--text-light);
            font-weight: 500;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 40px 20px;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            margin-top: 50px;
        }

        .footer-logo {
            width: 80px;
            height: auto;
            margin-bottom: 10px;
        }

        footer p {
            font-family: 'Cinzel', serif;
            color: var(--accent-gold);
            font-size: 1.2rem;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* Floating WhatsApp Button */
        .whatsapp-float {
            position: fixed;
            width: 60px;
            height: 60px;
            bottom: 40px;
            right: 40px;
            background-color: #25d366;
            color: #FFF;
            border-radius: 50px;
            text-align: center;
            font-size: 30px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.3);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: transform 0.3s ease;
        }

        .whatsapp-float:hover {
            transform: scale(1.1);
        }

    </style>
</head>
<body>

    <div class="container">
        
        <!-- About Section -->
        <section class="hero-section">
            <div class="about-left">
                <!-- IMPORTANT: Make sure photo.jpg is uploaded to your Github repo -->
                <img src="photo.jpg" alt="Yeshwanth Gowda V Profile" class="profile-photo">
                
                <h1>Yeshwanth Gowda V</h1>
                <h2>AI Marketing Specialist</h2>
                
                <p>AI research marketing specialist @ nammaweb and also expert in seo, geo, aeo optimization and ai driven lead generation and helping brands scale revenue.</p>
            </div>
            
            <div class="visual-right">
                <!-- IMPORTANT: Make sure to upload your 3D animated photo and name it 3d-photo.jpg (or change the name here) -->
                <img src="3d-photo.jpg" alt="3D Animation Display" class="photo-3d">
            </div>
        </section>

        <!-- Booking Section -->
        <section class="actions-section">
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSdZIxK-ZDoWXmdy04CBo3Cu44kyZy6OemEErPqYymfDoxq0_w/viewform?usp=publish-editor" target="_blank" class="btn-book">Book a Consultation</a>
        </section>

        <!-- Professional Links & Contact -->
        <section class="contact-grid">
            <!-- LinkedIn -->
            <a href="https://www.linkedin.com/in/yeshwanth-gowda-5376083b5?utm_source=share_via&utm_content=profile&utm_medium=member_ios" target="_blank" class="contact-card">
                <i class="fab fa-linkedin"></i>
                <h3>Professional Portfolio</h3>
            </a>
            
            <!-- Email -->
            <a href="mailto:yeshwanth.nammaweb@gmail.com" class="contact-card">
                <i class="fas fa-envelope"></i>
                <h3>yeshwanth.nammaweb@gmail.com</h3>
            </a>
            
            <!-- Direct Call -->
            <a href="tel:7204248002" class="contact-card">
                <i class="fas fa-phone-alt"></i>
                <h3>+91 7204248002</h3>
            </a>
        </section>

        <!-- Footer -->
        <footer>
            <!-- IMPORTANT: Make sure logo.png is uploaded to your Github repo -->
            <img src="logo.png" alt="Nammaweb Logo" class="footer-logo">
            <p>Nammaweb</p>
        </footer>

    </div>

    <!-- WhatsApp Pop Up Widget -->
    <!-- The link formats the number for WhatsApp API -->
    <a href="https://wa.me/917204248002" class="whatsapp-float" target="_blank" aria-label="Chat on WhatsApp">
        <i class="fab fa-whatsapp"></i>
    </a>

</body>
</html>
